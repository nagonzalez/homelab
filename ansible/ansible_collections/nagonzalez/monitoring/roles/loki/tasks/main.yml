---
# tasks file for nagonzalez.monitoring.loki

- name: Query current Perforce configurations
  ansible.builtin.shell: >-
    set -o pipefail &&
    echo "{{ loki_p4_password }}" | p4 -p {{ loki_p4_port }} -u {{ loki_p4_user }} login &&
    p4 -p {{ loki_p4_port }} -u {{ loki_p4_user }} configure show
  args:
    executable: /bin/bash
  register: loki_p4_config_show_raw
  changed_when: false
  become: true
  become_user: "{{ loki_p4_user }}"
  no_log: true

- name: Set Perforce logexport startup commands
  ansible.builtin.shell: >-
    set -o pipefail &&
    echo "{{ loki_p4_password }}" | p4 -p {{ loki_p4_port }} -u {{ loki_p4_user }} login &&
    p4 -p {{ loki_p4_port }} -u {{ loki_p4_user }} configure set startup.{{ log_index + 1 }}="logexport -I 1000 -e {{ loki_push_url }} {{ item }}"
  args:
    executable: /bin/bash
  loop: "{{ loki_p4_logs }}"
  loop_control:
    index_var: log_index
  # Only run if the exact startup command is not already configured
  when: >
    ("startup." ~ (log_index + 1) ~ "=logexport -I 1000 -e " ~ loki_push_url ~ " " ~ item) not in loki_p4_config_show_raw.stdout
  register: loki_p4_config_set_result
  changed_when: true
  notify: Restart Perforce
  become: true
  become_user: "{{ loki_p4_user }}"
  no_log: true
