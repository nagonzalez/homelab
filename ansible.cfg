[defaults]
# Specifies the directory paths where Ansible searches for installed collections and roles.
collections_path = ansible/ansible_collections

# Configures Ansible to automatically discover the target system's Python interpreter path
# and silences any discovery warnings in the output.
interpreter_python = auto_silent

# The temporary directory on remote hosts where Ansible uploads files and modules for execution.
# Using /tmp ensures the folder always exists on a new VM, preventing directory creation warnings.
remote_tmp = /tmp

# Disable SSH host key checking. This prevents connection warnings and failures
# when virtual machines are deleted and recreated with new host keys.
host_key_checking = False

[ssh_connection]
# Enable SSH pipelining. Reduces the number of SSH connections and operations by transferring
# modules over stdin instead of copying them, significantly speeding up execution.
pipelining = True

[callback_default]
# Formats the ansible-playbook stdout output using clean YAML syntax rather than JSON.
result_format = yaml
