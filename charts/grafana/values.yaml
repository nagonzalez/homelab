# Grafana Helm Wrapper Chart Configuration
# Values are nested under the 'grafana' key to target the sub-chart dependency.

grafana:
  # Load secrets from Kubernetes secret in the monitoring namespace
  envFromSecret: grafana-github-oauth

  grafana.ini:
    server:
      root_url: https://grafana.noeg.ai
    "auth.github":
      enabled: true
      allow_sign_up: true
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      allow_assign_grafana_admin: true
      role_attribute_strict: true
      # Enforce login only for the user 'nagonzalez'. Others get role 'None' and are denied login.
      role_attribute_path: login == 'nagonzalez' && 'GrafanaAdmin' || 'None'

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.noeg.ai
    tls:
      - hosts:
          - grafana.noeg.ai

  persistence:
    enabled: true
    type: pvc
    size: 2Gi

  initChownData:
    enabled: false

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-server.monitoring.svc.cluster.local
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      traefik:
        gnetId: 17347
        revision: 9
        datasource: Prometheus
