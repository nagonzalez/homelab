                "description": "Pattern to exclude for alloy service, that will be defined dynamically in $service_name variable. To create exclude pattern for another services just create duplicate of this variable with name like \"${service_name}_exclude\". For example prometheus_exclude, blackbox_exclude, yourapp_exclude."
