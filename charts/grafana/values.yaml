# Grafana Helm Wrapper Chart Configuration
# Values are nested under the 'grafana' key to target the sub-chart dependency.

grafana:
  # Load secrets from Kubernetes secret in the monitoring namespace
  envFromSecret: grafana-github-oauth

  grafana.ini:
    server:
      root_url: https://grafana.noeg.ai
    "auth.github":
      enabled: true
      allow_sign_up: true
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      allow_assign_grafana_admin: true
      role_attribute_strict: true
      # Enforce login only for the user 'nagonzalez'. Others get role 'None' and are denied login.
      role_attribute_path: login == 'nagonzalez' && 'GrafanaAdmin' || 'None'

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.noeg.ai
    tls:
      - hosts:
          - grafana.noeg.ai

  persistence:
    enabled: true
    type: pvc
    size: 2Gi

  initChownData:
    enabled: false

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-server.monitoring.svc.cluster.local
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      traefik:
        gnetId: 17347
        revision: 9
        datasource: Prometheus
      loki-logs:
        gnetId: 24574
        revision: 1
        datasource: Loki
      loki-self-monitoring:
        json: |
          {
            "annotations": [
              {
                "kind": "AnnotationQuery",
                "spec": {
                  "builtIn": true,
                  "enable": true,
                  "hide": true,
                  "iconColor": "rgba(0, 211, 255, 1)",
                  "name": "Annotations & Alerts",
                  "query": {
                    "datasource": {
                      "name": "grafana"
                    },
                    "group": "grafana",
                    "kind": "DataQuery",
                    "spec": {
                      "limit": 100,
                      "matchAny": false,
                      "tags": [],
                      "type": "dashboard"
                    },
                    "version": "v0"
                  }
                }
              }
            ],
            "cursorSync": "Off",
            "description": "Loki dashboard with quick search and timeline.",
            "editable": true,
            "elements": {
              "panel-2": {
                "kind": "Panel",
                "spec": {
                  "data": {
                    "kind": "QueryGroup",
                    "spec": {
                      "queries": [
                        {
                          "kind": "PanelQuery",
                          "spec": {
                            "hidden": false,
                            "query": {
                              "datasource": {
                                "name": "Loki"
                              },
                              "group": "loki",
                              "kind": "DataQuery",
                              "spec": {
                                "expr": "{namespace=\"$namespace\", app=\"$workload\", instance=~\"$pod\"} |~ \"$search\""
                              },
                              "version": "v0"
                            },
                            "refId": "A"
                          }
                        }
                      ],
                      "queryOptions": {},
                      "transformations": []
                    }
                  },
                  "description": "",
                  "id": 2,
                  "links": [],
                  "title": "Logs",
                  "vizConfig": {
                    "group": "logs",
                    "kind": "VizConfig",
                    "spec": {
                      "fieldConfig": {
                        "defaults": {},
                        "overrides": []
                      },
                      "options": {
                        "dedupStrategy": "none",
                        "enableInfiniteScrolling": false,
                        "enableLogDetails": true,
                        "prettifyLogMessage": false,
                        "showCommonLabels": false,
                        "showControls": false,
                        "showFieldSelector": false,
                        "showLabels": true,
                        "showLevel": true,
                        "showTime": true,
                        "sortOrder": "Descending",
                        "timestampResolution": "ms",
                        "unwrappedColumns": false,
                        "wrapLogMessage": true
                      }
                    },
                    "version": "13.0.1+security-01"
                  }
                }
              },
              "panel-6": {
                "kind": "Panel",
                "spec": {
                  "data": {
                    "kind": "QueryGroup",
                    "spec": {
                      "queries": [
                        {
                          "kind": "PanelQuery",
                          "spec": {
                            "hidden": false,
                            "query": {
                              "datasource": {
                                "name": "Loki"
                              },
                              "group": "loki",
                              "kind": "DataQuery",
                              "spec": {
                                "expr": "sum(count_over_time({namespace=\"$namespace\", app=\"$workload\", instance=~\"$pod\"} |~ \"$search\"[$__interval]))"
