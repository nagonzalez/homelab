# Loki Helm Wrapper Chart Configuration
# Values are nested under the 'loki' key to target the sub-chart dependency.

loki:
  deploymentMode: Monolithic

  loki:
    auth_enabled: false
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    limits_config:
      retention_period: 30d
      ingestion_rate_mb: 20
      ingestion_burst_size_mb: 30
      allow_structured_metadata: true
    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    replicas: 1
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3100"
      prometheus.io/path: "/metrics"
    persistence:
      enabled: true
      size: 10Gi

  # Disable other components to avoid validation errors
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0

  memberlist:
    service:
      publishNotReadyAddresses: true

  gateway:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - host: loki.noeg.ai
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - loki.noeg.ai
