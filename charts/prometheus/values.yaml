# Prometheus Helm Wrapper Chart Configuration
# Values are nested under the 'prometheus' key to target the sub-chart dependency.

prometheus:
  # Configure sub-chart values
  server:
    retention: "30d"
    retentionSize: "6GB"
    persistentVolume:
      enabled: true
      size: 8Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - prometheus.noeg.ai
      tls:
        - hosts:
            - prometheus.noeg.ai
  alertmanager:
    persistentVolume:
      enabled: true
      size: 2Gi
